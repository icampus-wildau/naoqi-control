[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "naoqi-control"
version = "0.1.0"
description = "Async NAOqi control for speech, motion, touch, and LEDs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Valentin Schröter Bonk", email = "vasc9380@th-wildau.de" }]
maintainers = [{ name = "Valentin Schröter Bonk", email = "vasc9380@th-wildau.de" }]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "qi>=3.1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["naoqi_control"]
